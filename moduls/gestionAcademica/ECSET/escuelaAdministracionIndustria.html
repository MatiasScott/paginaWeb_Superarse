<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta content="Educación Superior, Negocios, Tecnología, Ciencias Sociales" name="keywords" />
    <meta content="Oferta Académica Escuela de Ciencias Sociales, Empresariales y Tecnológicas" name="description" />
    <title>Escuela de Ciencias Sociales, Empresariales y Tecnológicas ECSET</title>
    <style>
        body { opacity: 0; transition: opacity 0.3s ease; }
    </style>

    <script src="/js/common/page-head.js" data-extra-styles="/css/modals-custom.css"></script>

    <style>
      /* Posicionamiento del logo en la esquina superior izquierda */
      .logo-superior-izq {
        position: absolute;
        top: 25px;         /* Distancia desde el borde superior */
        left: 100px;        /* Distancia desde el borde izquierdo */
        max-width: 180px;   /* Ajusta este ancho según el tamaño de tu logo */
        height: auto;      /* Mantiene la proporción de la imagen */
        z-index: 10;       /* Asegura que quede por encima de los círculos de fondo */
      }

      /* Adaptación para pantallas de celulares o tablets */
      @media (max-width: 991px) {
        .logo-superior-izq {
          position: relative;
          display: block;
          margin: 0 auto 25px auto; /* Se centra arriba del título en pantallas chicas */
          top: 0;
          left: 0;
          max-width: 150px;
        }
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container-fluid bg-light position-relative shadow-sm" id="header-container"></div>

    <div class="container-fluid py-5 container-top position-relative">
      
      <img src="\assets\img\gestionAcademica\Logos\ECSET.png" alt="Logo Escuela" class="logo-superior-izq" />

      <svg class="bg-circles" width="400" height="400" viewBox="0 0 100 100">
        <circle cx="80" cy="20" r="40" fill="#517CE0" /> 
      </svg>

      <div class="container text-center">
        <div class="text-center pb-2">
          <p class="section-title px-5">
             <span class="px-2">NUESTRA FORMACIÓN</span>
          </p>
          <h1 class="mb-4">Oferta Académica</h1>
        </div>
        
        <div class="school-badgeECSET">
            <i class="fas fa-chart-line mr-2"></i> Escuela de Ciencias Sociales, Empresariales y Tecnológicas ECSET
        </div>

        <div class="row justify-content-center" id="administrationAndIndustryCards">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-success" role="status">
                    <span class="sr-only">Cargando carreras de ECSET...</span>
                </div>
            </div>
        </div>
      </div>
    </div>

    <div id="administrationAndIndustryModals"></div>

    <div class="color-bar-container">
        <div class="color-stripe color-stripe-1"></div>
        <div class="color-stripe color-stripe-2"></div>
        <div class="color-stripe color-stripe-3"></div>
        <div class="color-stripe color-stripe-4"></div>
    </div>

    <div class="footer-container"></div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
    <script src="/lib/easing/easing.min.js"></script>
    <script src="/lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="/lib/isotope/isotope.pkgd.min.js"></script>
    <script src="/lib/lightbox/js/lightbox.min.js"></script>

    <script src="/js/moduls/header.js"></script>
    <script src="/js/moduls/footer.js"></script>
    <script src="/js/moduls/GestionAcademica/administrationAndIndustryData.js?v=1"></script>
    <script src="/js/global.js"></script>
    <script src="/js/main.js"></script>

    <script>
      $(document).ready(function() {
        if (typeof generarAdministracionEIndustria === "function") {
          generarAdministracionEIndustria();
        }
      });
    </script>
  </body>
</html>
